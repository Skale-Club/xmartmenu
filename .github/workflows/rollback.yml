name: Redeploy or roll back

# Runs an image that was already built and validated, by commit SHA. Nothing is
# rebuilt: the SHA must have a green CI run on main and an image in GHCR.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to run in production
        required: true
        type: string

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

env:
  IMAGE_NAME: ghcr.io/skale-club/xmartmenu
  APP_UUID: gmaayluj11x1m6j7baogonfn
  COOLIFY_BASE: https://coolify.skale.club
  PUBLIC_URL: https://xmartmenu.skale.club

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The SHA passed CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Give the full 40-character SHA."; exit 1; }
          ok="$(gh run list --workflow ci.yml --branch main --commit "${SHA}" --status success --json databaseId --jq 'length')"
          if [ "${ok}" = "0" ]; then
            echo "::error::No successful CI run on main for ${SHA}."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The image exists
        run: docker manifest inspect "${IMAGE_NAME}:${{ inputs.sha }}" > /dev/null

      - name: Deploy this SHA with Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: bash scripts/coolify-deploy.sh "${{ inputs.sha }}"
