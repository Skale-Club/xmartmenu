name: Final cutover (Supabase to own PostgreSQL)

# One operation, only from main, started by hand. See docs/xmartmenu-final-cutover.md.
#   plan      read only; prints counts
#   apply     stop app, freeze Supabase, copy, SQL proposals, login, env, one deploy, verify
#   rollback  only while the own database has no new writes
# Secrets: COOLIFY_TOKEN, SUPABASE_SOURCE_DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# CUTOVER_SSH_HOST, CUTOVER_SSH_KEY, CUTOVER_SSH_HOST_KEY. Variable: NEXT_PUBLIC_SUPABASE_URL.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan | apply | rollback
        required: true
        type: choice
        options: [plan, apply, rollback]
        default: plan
      confirm_sha:
        description: First 8 characters of the main commit (required for apply and rollback)
        required: false
        type: string
      discard_new_writes:
        description: rollback only, after new writes were detected - type DISCARD-<run id> to export and then discard them
        required: false
        type: string

# Same group as the deploy: no build or deploy may overlap the window.
concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  cutover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Create the environment once (Settings > Environments > final-cutover) restricted to the main branch,
    # with required reviewers if wanted. The first step below fails closed when it is not restricted.
    environment: final-cutover
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: The environment is restricted to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          policy="$(gh api "repos/${GITHUB_REPOSITORY}/environments/final-cutover" --jq '.deployment_branch_policy.custom_branch_policies // false' 2>/dev/null || echo unreadable)"
          [[ "${policy}" == "true" ]] || { echo "::error::Environment final-cutover must restrict deployments to selected branches (main); see docs/xmartmenu-final-cutover.md."; exit 1; }

      - name: Guard (apply and rollback)
        if: inputs.mode != 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm_sha }}
          SHA: ${{ github.sha }}
        run: |
          [[ "${CONFIRM}" == "${SHA:0:8}" ]] || { echo "::error::confirm_sha must be ${SHA:0:8}"; exit 1; }
          # A rollback must stay possible when the current commit has no green CI; only apply needs it.
          [[ "${{ inputs.mode }}" == "apply" ]] || exit 0
          ok="$(gh run list --workflow ci.yml --branch main --commit "${SHA}" --status success --json databaseId --jq 'length')"
          [[ "${ok}" != "0" ]] || { echo "::error::No successful CI run on main for ${SHA}."; exit 1; }

      - name: Log in to GHCR
        if: inputs.mode == 'apply'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The image for this commit exists
        if: inputs.mode == 'apply'
        run: |
          repository="ghcr.io/skale-club/xprout"
          if ! docker manifest inspect "${repository}:${{ github.sha }}" > /dev/null 2>&1; then
            repository="ghcr.io/skale-club/xmartmenu"
            docker manifest inspect "${repository}:${{ github.sha }}" > /dev/null
          fi
          echo "IMAGE_REPOSITORY=${repository}" >> "$GITHUB_ENV"

      - name: Run the operation
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SUPABASE_SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_SOURCE_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          CUTOVER_SSH_HOST: ${{ secrets.CUTOVER_SSH_HOST }}
          CUTOVER_SSH_KEY: ${{ secrets.CUTOVER_SSH_KEY }}
          CUTOVER_SSH_HOST_KEY: ${{ secrets.CUTOVER_SSH_HOST_KEY }}
        run: bash scripts/ops/run-xprout-final-cutover.sh "${{ inputs.mode }}" "${{ github.sha }}" "${{ inputs.discard_new_writes }}"
