name: Build and Deploy

# CI→GHCR→Coolify pipeline. Builds Docker image off-VPS (GitHub runners
# have 16GB RAM; the 8GB CX32 OOM-thrashes on next build), pushes to GHCR,
# then triggers Coolify to `docker pull` + run the prebuilt image.
#
# ── Change these two lines when copying to another repo ──────────────────────
#   IMAGE_NAME   ghcr.io/skale-club/<app-name>
#   APP_UUID     Coolify resource UUID (Settings → UUID in the app UI)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skale-club/xmartmenu
  APP_UUID: gmaayluj11x1m6j7baogonfn
  COOLIFY_BASE: https://coolify.skale.club

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Trigger Coolify deploy (pull prebuilt image)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::warning::COOLIFY_TOKEN not set — skipping Coolify trigger."
            echo "Image built and pushed to GHCR. Set COOLIFY_TOKEN secret to auto-deploy."
            exit 0
          fi
          echo "Triggering Coolify pull for app ${APP_UUID}…"
          deploy_response="$(curl --fail-with-body -sS --retry 3 --retry-all-errors \
            --request POST \
            "${COOLIFY_BASE}/api/v1/deploy?uuid=${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")"
          echo "${deploy_response}"

          deployment_uuid="$(jq -r '.deployments[0].deployment_uuid // empty' <<<"${deploy_response}")"
          if [ -z "${deployment_uuid}" ]; then
            echo "::error::Coolify did not return a deployment UUID."
            exit 1
          fi

          echo "Coolify deployment ${deployment_uuid} queued; waiting for completion…"
          for attempt in $(seq 1 60); do
            deployment="$(curl --fail-with-body -sS --retry 3 --retry-all-errors \
              "${COOLIFY_BASE}/api/v1/deployments/${deployment_uuid}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}")"
            status="$(jq -r '.status // empty' <<<"${deployment}")"
            echo "Coolify status (${attempt}/60): ${status:-unknown}"

            case "${status}" in
              finished)
                break
                ;;
              failed|cancelled-by-user)
                echo "::error::Coolify deployment ended with status ${status}."
                exit 1
                ;;
            esac

            if [ "${attempt}" -eq 60 ]; then
              echo "::error::Timed out waiting for Coolify deployment ${deployment_uuid}."
              exit 1
            fi
            sleep 5
          done

          echo "Coolify deployment finished; checking production health…"
          curl --fail-with-body -sS --retry 12 --retry-delay 5 --retry-all-errors \
            "https://xmartmenu.skale.club/api/health"
          echo
          echo "Production is healthy."
