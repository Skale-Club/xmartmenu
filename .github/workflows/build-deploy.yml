name: Build and Deploy

# CI→GHCR→Coolify pipeline. Builds the Docker image off-VPS (GitHub runners
# have 16GB RAM; the 8GB CX32 OOM-thrashes on next build), pushes it to GHCR
# tagged with the commit SHA, then has Coolify run exactly that tag.
#
# Not triggered on its own: ci.yml calls it after `checks` and `e2e` pass on
# a push to main, so a commit that fails the tests never reaches production.
# To redeploy or roll back an already-validated commit, use rollback.yml.
#
# ── Change these lines when copying to another repo ──────────────────────────
#   IMAGE_NAME   ghcr.io/skale-club/<app-name>
#   APP_UUID     Coolify resource UUID (Settings → UUID in the app UI)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      sha:
        description: Commit that passed CI
        required: true
        type: string

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skale-club/xmartmenu
  APP_UUID: gmaayluj11x1m6j7baogonfn
  COOLIFY_BASE: https://coolify.skale.club
  PUBLIC_URL: https://xmartmenu.skale.club

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public values only. Secrets go through `secrets:` (BuildKit mounts),
          # which keeps them out of image history and the build cache.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            GIT_SHA=${{ inputs.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy this SHA with Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::warning::COOLIFY_TOKEN not set — image pushed, deploy skipped."
            exit 0
          fi
          bash scripts/coolify-deploy.sh "${{ inputs.sha }}"
