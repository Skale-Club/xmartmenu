# Lighthouse — production health (informational)
#
# Audits the site that is LIVE (xmartmenu.skale.club), so it reports the state
# of production, not of the pull request: a PR cannot turn it green and should
# not be blocked by it. The merge gate is the Lighthouse step inside the e2e
# job of ci.yml, which audits the PR's own build against the local database.
#
# Threshold history: Phase 14 baseline / = 100, /restaurante-teste = 94;
# Phase 17 gate 0.88. Kept here as the production target.

name: Lighthouse (production, informational)

on:
  pull_request:
    branches:
      - main

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        # Production state, not the PR: the report is kept, the check stays
        # green (a job-level continue-on-error still shows the check as failed).
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
